<!doctype html>
<html lang="en" data-resolution="portrait-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        background: #07090f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #cam,
      #punch {
        position: absolute;
        inset: 0;
        transform-origin: 50% 30%;
      }
      #cam {
        z-index: 1;
      }
      #footage {
        position: absolute;
        left: 0;
        top: 0;
        width: 2160px;
        height: 3840px;
        object-fit: cover;
      }
      #shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.35) 0%,
            rgba(0, 0, 0, 0) 24%,
            rgba(0, 0, 0, 0) 46%,
            rgba(0, 0, 0, 0.55) 72%,
            rgba(0, 0, 0, 0.7) 100%
          ),
          radial-gradient(ellipse 75% 60% at 50% 38%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.35) 100%);
      }
      .streak {
        position: absolute;
        left: -1600px;
        top: -600px;
        width: 1100px;
        height: 5040px;
        z-index: 9;
        background: linear-gradient(
          90deg,
          rgba(255, 210, 63, 0) 0%,
          rgba(255, 159, 67, 0.55) 35%,
          rgba(255, 255, 255, 0.85) 50%,
          rgba(255, 61, 127, 0.55) 65%,
          rgba(255, 61, 127, 0) 100%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.4"
      data-width="2160"
      data-height="3840"
    >
      <div id="cam">
        <div id="punch">
          <video
            id="footage"
            class="clip"
            src="assets/footage.mp4"
            data-start="0"
            data-duration="15.65"
            data-track-index="0"
            data-has-audio="true"
            data-volume="1"
            playsinline
          ></video>
        </div>
      </div>
      <div id="shade" class="clip" data-start="0" data-duration="15.65" data-track-index="1"></div>
      <div id="streak1" class="clip streak" data-start="4.3" data-duration="0.6" data-track-index="2" data-layout-ignore></div>
      <div id="streak2" class="clip streak" data-start="8.05" data-duration="0.6" data-track-index="3" data-layout-ignore></div>
      <div id="streak3" class="clip streak" data-start="11.35" data-duration="0.6" data-track-index="4" data-layout-ignore></div>

      <div
        id="sections"
        data-composition-id="sections"
        data-composition-src="compositions/sections.html"
        data-start="4.4"
        data-duration="10.6"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 5"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="15.0"
        data-track-index="6"
        data-track-kind="captions"
        data-width="2160"
        data-height="3840"
        style="z-index: 7"
      ></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 8"
      ></div>
      <div
        id="recap"
        data-composition-id="recap"
        data-composition-src="compositions/recap.html"
        data-start="15.0"
        data-duration="2.7"
        data-track-index="8"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 10"
      ></div>
      <div
        id="follow"
        data-composition-id="follow"
        data-composition-src="compositions/follow.html"
        data-start="17.6"
        data-duration="3.8"
        data-track-index="9"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 11"
      ></div>

      <!-- Sound effects (CC0) -->
      <audio id="sfx-hk-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="0.08" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-hk-salam" class="clip" src="assets/sfx/pop.ogg" data-start="0.13" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-hk-spark" class="clip" src="assets/sfx/pop2.ogg" data-start="0.42" data-duration="0.08" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-hk-kicker" class="clip" src="assets/sfx/pop.ogg" data-start="1.32" data-duration="0.12" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-hk-fine" class="clip" src="assets/sfx/pop.ogg" data-start="2.1" data-duration="0.12" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-hk-strike" class="clip" src="assets/sfx/pop2.ogg" data-start="3.3" data-duration="0.08" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-hk-instead" class="clip" src="assets/sfx/pop2.ogg" data-start="3.42" data-duration="0.08" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-s1-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="4.42" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-s1-badge" class="clip" src="assets/sfx/pop.ogg" data-start="4.5" data-duration="0.12" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-s1-card" class="clip" src="assets/sfx/pop2.ogg" data-start="4.62" data-duration="0.08" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-g0-key" class="clip" src="assets/sfx/pop.ogg" data-start="4.92" data-duration="0.12" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-g1-key" class="clip" src="assets/sfx/pop2.ogg" data-start="7.22" data-duration="0.08" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-s2-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="8.18" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-s2-badge" class="clip" src="assets/sfx/pop.ogg" data-start="8.25" data-duration="0.12" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-s2-card" class="clip" src="assets/sfx/pop2.ogg" data-start="8.37" data-duration="0.08" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-g2-key" class="clip" src="assets/sfx/pop.ogg" data-start="8.66" data-duration="0.12" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-g3-key" class="clip" src="assets/sfx/pop2.ogg" data-start="10.58" data-duration="0.08" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-s3-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="11.48" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-s3-badge" class="clip" src="assets/sfx/pop.ogg" data-start="11.55" data-duration="0.12" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-s3-card" class="clip" src="assets/sfx/pop2.ogg" data-start="11.67" data-duration="0.08" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-g4-key" class="clip" src="assets/sfx/pop.ogg" data-start="13.12" data-duration="0.12" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-g5-key" class="clip" src="assets/sfx/pop2.ogg" data-start="14.42" data-duration="0.08" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-rc-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="14.98" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-rc-r0" class="clip" src="assets/sfx/pop.ogg" data-start="15.3" data-duration="0.12" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-rc-r1" class="clip" src="assets/sfx/pop.ogg" data-start="15.6" data-duration="0.12" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-rc-r2" class="clip" src="assets/sfx/pop.ogg" data-start="15.9" data-duration="0.12" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-rc-save" class="clip" src="assets/sfx/pop2.ogg" data-start="16.3" data-duration="0.08" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-fo-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="17.62" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-fo-pop" class="clip" src="assets/sfx/pop.ogg" data-start="17.72" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-fo-avatar" class="clip" src="assets/sfx/pop2.ogg" data-start="18.08" data-duration="0.08" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-fo-click" class="clip" src="assets/sfx/click.ogg" data-start="19.45" data-duration="0.1" data-track-index="10" data-volume="0.8"></audio>
      <audio id="sfx-fo-ding" class="clip" src="assets/sfx/ding.ogg" data-start="19.51" data-duration="0.69" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-fo-toast" class="clip" src="assets/sfx/pop.ogg" data-start="19.65" data-duration="0.12" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-fo-exit" class="clip" src="assets/sfx/whoosh.ogg" data-start="20.85" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Slow push across the footage.
      tl.fromTo("#cam", { scale: 1.03 }, { scale: 1.1, duration: 15.65, ease: "none" }, 0);

      // Punch-ins on each key word.
      tl.set("#punch", { scale: 1 }, 0);
      [
        [4.94, 1.05],
        [7.24, 1.03],
        [8.68, 1.05],
        [10.6, 1.03],
        [13.14, 1.06],
        [14.44, 1.03],
      ].forEach(([t, s]) => {
        tl.to("#punch", { scale: s, duration: 0.16, ease: "back.out(2.2)" }, t);
        tl.to("#punch", { scale: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.45);
      });

      // Light streaks sweep across at each new section.
      ["#streak1", "#streak2", "#streak3"].forEach((sel, i) => {
        const t0 = [4.3, 8.05, 11.35][i];
        tl.fromTo(sel, { x: 0, rotation: 18, opacity: 0 }, { x: 4200, rotation: 18, opacity: 1, duration: 0.55, ease: "power2.inOut" }, t0);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
