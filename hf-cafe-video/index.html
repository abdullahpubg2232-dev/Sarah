<!doctype html>
<html lang="en" data-resolution="portrait-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        background: #07090f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #cam,
      #punch {
        position: absolute;
        inset: 0;
        transform-origin: 50% 30%;
      }
      #cam {
        z-index: 1;
      }
      #footage {
        position: absolute;
        left: 0;
        top: 0;
        width: 2160px;
        height: 3840px;
        object-fit: cover;
      }
      #shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 45%,
            rgba(0, 0, 0, 0.45) 70%,
            rgba(0, 0, 0, 0.6) 100%
          ),
          radial-gradient(ellipse 75% 60% at 50% 38%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52.1"
      data-width="2160"
      data-height="3840"
    >
      <div id="cam">
        <div id="punch">
          <video
            id="footage"
            class="clip"
            src="assets/footage.mp4"
            data-start="0"
            data-duration="48.38"
            data-track-index="0"
            data-has-audio="true"
            data-volume="1"
            playsinline
          ></video>
        </div>
      </div>
      <div id="shade" class="clip" data-start="0" data-duration="48.38" data-track-index="1"></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="36.5"
        data-track-index="5"
        data-track-kind="captions"
        data-width="2160"
        data-height="3840"
        style="z-index: 7"
      ></div>
      <div
        id="follow"
        data-composition-id="follow"
        data-composition-src="compositions/follow.html"
        data-start="48.3"
        data-duration="3.8"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 11"
      ></div>

      <!-- Music bed at 20% (Mixkit #1168 "Coffee or Tea", Mixkit Stock Music Free License) -->
      <audio
        id="music"
        class="clip"
        src="assets/music.mp3"
        data-start="0"
        data-duration="52.1"
        data-track-index="9"
        data-volume="0.2"
      ></audio>

      <!-- Sound effects (CC0) -->
      <audio id="sfx-b0" class="clip" src="assets/sfx/pop.ogg" data-start="15.73" data-duration="0.12" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-t1" class="clip" src="assets/sfx/pop2.ogg" data-start="18.7" data-duration="0.08" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-b1" class="clip" src="assets/sfx/pop.ogg" data-start="19.08" data-duration="0.12" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-b2" class="clip" src="assets/sfx/pop.ogg" data-start="31.23" data-duration="0.12" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-t3" class="clip" src="assets/sfx/pop2.ogg" data-start="33.85" data-duration="0.08" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-b3" class="clip" src="assets/sfx/pop.ogg" data-start="34.28" data-duration="0.12" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-fo-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="48.32" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-fo-pop" class="clip" src="assets/sfx/pop.ogg" data-start="48.42" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-fo-avatar" class="clip" src="assets/sfx/pop2.ogg" data-start="48.78" data-duration="0.08" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-fo-click" class="clip" src="assets/sfx/click.ogg" data-start="50.15" data-duration="0.1" data-track-index="10" data-volume="0.8"></audio>
      <audio id="sfx-fo-ding" class="clip" src="assets/sfx/ding.ogg" data-start="50.21" data-duration="0.69" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-fo-toast" class="clip" src="assets/sfx/pop.ogg" data-start="50.35" data-duration="0.12" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-fo-exit" class="clip" src="assets/sfx/whoosh.ogg" data-start="51.55" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Slow push, plus a punch-in when each phrase lands.
      tl.fromTo("#cam", { scale: 1.02 }, { scale: 1.08, duration: 48.38, ease: "none" }, 0);
      tl.set("#punch", { scale: 1 }, 0);
      [
        [15.9, 1.05],
        [19.25, 1.04],
        [31.4, 1.05],
        [34.45, 1.04],
      ].forEach(([t, s]) => {
        tl.to("#punch", { scale: s, duration: 0.2, ease: "back.out(2)" }, t);
        tl.to("#punch", { scale: 1, duration: 0.8, ease: "power2.inOut" }, t + 1.6);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
