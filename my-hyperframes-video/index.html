<!doctype html>
<html lang="en" data-resolution="portrait-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07090f;
        --ink: #ffffff;
        --red: #ff2d2d;
        --yellow: #ffd23f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Camera rig: push (cam) > punch-ins (punch) > shake. Untimed wrappers. */
      #cam,
      #punch,
      #shake {
        position: absolute;
        inset: 0;
      }
      #cam {
        z-index: 1;
        transform-origin: 50% 32%;
      }
      #punch {
        transform-origin: 50% 32%;
      }
      #footage {
        position: absolute;
        left: 0;
        top: 0;
        width: 2160px;
        height: 3840px;
        object-fit: cover;
      }
      #shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.18) 0%,
            rgba(0, 0, 0, 0) 22%,
            rgba(0, 0, 0, 0) 48%,
            rgba(0, 0, 0, 0.5) 74%,
            rgba(0, 0, 0, 0.65) 100%
          ),
          radial-gradient(ellipse 75% 60% at 50% 38%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.4) 100%);
      }
      #flash {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: radial-gradient(
          ellipse 70% 60% at 50% 40%,
          rgba(255, 45, 45, 0.25) 0%,
          rgba(255, 30, 30, 0.75) 100%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="17.4"
      data-width="2160"
      data-height="3840"
    >
      <!-- Footage with its own sound -->
      <div id="cam">
        <div id="punch">
          <div id="shake">
            <video
              id="footage"
              class="clip"
              src="assets/footage.mp4"
              data-start="0"
              data-duration="11.5"
              data-track-index="0"
              data-has-audio="true"
              data-volume="1"
              playsinline
            ></video>
          </div>
        </div>
      </div>
      <div id="shade" class="clip" data-start="0" data-duration="11.5" data-track-index="1"></div>
      <div id="flash" class="clip" data-start="8.6" data-duration="2.3" data-track-index="2"></div>

      <!-- Scenes -->
      <div
        id="gauge"
        data-composition-id="gauge"
        data-composition-src="compositions/gauge.html"
        data-start="2.5"
        data-duration="8.9"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 5"
      ></div>
      <div
        id="cards"
        data-composition-id="cards"
        data-composition-src="compositions/cards.html"
        data-start="3.2"
        data-duration="8"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 6"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="11.5"
        data-track-index="5"
        data-track-kind="captions"
        data-width="2160"
        data-height="3840"
        style="z-index: 7"
      ></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.7"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 8"
      ></div>
      <div
        id="summary"
        data-composition-id="summary"
        data-composition-src="compositions/summary.html"
        data-start="11.3"
        data-duration="2.45"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 10"
      ></div>
      <div
        id="follow"
        data-composition-id="follow"
        data-composition-src="compositions/follow.html"
        data-start="13.6"
        data-duration="3.8"
        data-track-index="8"
        data-track-kind="graphics"
        data-width="2160"
        data-height="3840"
        style="z-index: 11"
      ></div>

      <!-- Sound effects (CC0). Peaks land with the picture. -->
      <audio id="sfx-hook-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="0.1" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-hook-pop" class="clip" src="assets/sfx/pop.ogg" data-start="0.38" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-hook-pop2" class="clip" src="assets/sfx/pop2.ogg" data-start="0.72" data-duration="0.08" data-track-index="12" data-volume="0.4"></audio>

      <audio id="sfx-r1" class="clip" src="assets/sfx/pop.ogg" data-start="2.72" data-duration="0.12" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-r1-angry" class="clip" src="assets/sfx/pop2.ogg" data-start="3.12" data-duration="0.08" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-card1" class="clip" src="assets/sfx/pop2.ogg" data-start="3.3" data-duration="0.08" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-r2" class="clip" src="assets/sfx/pop2.ogg" data-start="4" data-duration="0.08" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-r3" class="clip" src="assets/sfx/pop.ogg" data-start="4.66" data-duration="0.12" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-r3-angry" class="clip" src="assets/sfx/pop2.ogg" data-start="5.12" data-duration="0.08" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-r4" class="clip" src="assets/sfx/pop2.ogg" data-start="5.54" data-duration="0.08" data-track-index="10" data-volume="0.55"></audio>

      <audio id="sfx-f1" class="clip" src="assets/sfx/pop.ogg" data-start="8.36" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-f1-hit" class="clip" src="assets/sfx/punch.ogg" data-start="8.72" data-duration="0.53" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-card2" class="clip" src="assets/sfx/pop2.ogg" data-start="8.9" data-duration="0.08" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-f2" class="clip" src="assets/sfx/pop.ogg" data-start="9.76" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-f2-hit" class="clip" src="assets/sfx/punch.ogg" data-start="10.18" data-duration="0.53" data-track-index="12" data-volume="0.65"></audio>

      <audio id="sfx-sum-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="11.32" data-duration="0.28" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-sum-a" class="clip" src="assets/sfx/pop.ogg" data-start="11.75" data-duration="0.12" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-sum-b" class="clip" src="assets/sfx/pop.ogg" data-start="12.15" data-duration="0.12" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-sum-c" class="clip" src="assets/sfx/pop2.ogg" data-start="12.55" data-duration="0.08" data-track-index="10" data-volume="0.4"></audio>

      <audio id="sfx-fol-whoosh" class="clip" src="assets/sfx/whoosh.ogg" data-start="13.62" data-duration="0.28" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-fol-pop" class="clip" src="assets/sfx/pop.ogg" data-start="13.72" data-duration="0.12" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-fol-avatar" class="clip" src="assets/sfx/pop2.ogg" data-start="14.08" data-duration="0.08" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-fol-click" class="clip" src="assets/sfx/click.ogg" data-start="15.45" data-duration="0.1" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-fol-ding" class="clip" src="assets/sfx/ding.ogg" data-start="15.51" data-duration="0.69" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-fol-toast" class="clip" src="assets/sfx/pop.ogg" data-start="15.65" data-duration="0.12" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-fol-exit" class="clip" src="assets/sfx/whoosh.ogg" data-start="16.85" data-duration="0.28" data-track-index="11" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Slow push across the footage.
      tl.fromTo("#cam", { scale: 1.03 }, { scale: 1.1, duration: 11.5, ease: "none" }, 0);

      // Punch-ins on the stressed "ANGRY" lines and on each "FURIOUS".
      const punches = [
        [3.14, 1.05],
        [5.14, 1.05],
        [8.74, 1.09],
        [10.2, 1.13],
      ];
      tl.set("#punch", { scale: 1 }, 0);
      punches.forEach(([t, s]) => {
        tl.to("#punch", { scale: s, duration: 0.16, ease: "back.out(2.2)" }, t);
        tl.to("#punch", { scale: 1, duration: 0.6, ease: "power2.inOut" }, t + 0.55);
      });

      // Deterministic decaying shake on FURIOUS.
      tl.set("#shake", { x: 0, y: 0, rotation: 0 }, 0);
      [
        [8.74, 34],
        [10.2, 50],
      ].forEach(([t0, amp]) => {
        for (let k = 0; k < 16; k++) {
          const d = Math.exp(-k * 0.22) * amp;
          tl.to(
            "#shake",
            {
              x: Math.sin(k * 2.9) * d,
              y: Math.cos(k * 2.3) * d * 0.7,
              rotation: Math.sin(k * 1.7) * d * 0.02,
              duration: 0.033,
              ease: "none",
            },
            t0 + k * 0.033,
          );
        }
        tl.to("#shake", { x: 0, y: 0, rotation: 0, duration: 0.05, ease: "none" }, t0 + 16 * 0.033);
      });

      // Red flash on each FURIOUS, with a lingering red edge at the top level.
      tl.set("#flash", { opacity: 0 }, 8.6);
      tl.to("#flash", { opacity: 0.85, duration: 0.05, ease: "none" }, 8.74);
      tl.to("#flash", { opacity: 0.22, duration: 0.45, ease: "power2.out" }, 8.79);
      tl.to("#flash", { opacity: 1, duration: 0.05, ease: "none" }, 10.2);
      tl.to("#flash", { opacity: 0.3, duration: 0.5, ease: "power2.out" }, 10.25);
      tl.to("#flash", { opacity: 0, duration: 0.15, ease: "power2.in" }, 10.75);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
