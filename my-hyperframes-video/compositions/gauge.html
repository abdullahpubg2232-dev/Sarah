          transform="rotate(-90 220 220)"
        />
        <g id="gg-face">
          <circle id="gg-face-bg" cx="220" cy="220" r="118" fill="#ffd23f" />
          <line id="gg-brow-l" x1="160" y1="182" x2="204" y2="196" stroke="#0b0b0b" stroke-width="14" stroke-linecap="round" />
          <line id="gg-brow-r" x1="280" y1="182" x2="236" y2="196" stroke="#0b0b0b" stroke-width="14" stroke-linecap="round" />

  <script>
    const tl = gsap.timeline({ paused: true });
    const C = 1118.4;
    const H = 2.5; // host start, to write levels in film time

    tl.fromTo(
      "#gg-wrap",
      { opacity: 0, scale: 0.5, y: -120 },
      { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" },
      0.05,
    );

    // [film time, level 0..1, colour]
    const levels = [
      [2.6, 0.12, "#ffd23f"],
      [3.14, 0.3, "#ffb52e"],
      [4.34, 0.45, "#ff8a1f"],
      [5.14, 0.6, "#ff6a1f"],
      [5.86, 0.72, "#ff4a1f"],
      [8.74, 0.9, "#ff2d2d"],
      [10.2, 1, "#e00000"],
    ];
    levels.forEach(([t, v, c], i) => {
      const at = t - H;
      tl.to("#gg-arc", { attr: { "stroke-dashoffset": C * (1 - v) }, stroke: c, duration: 0.35, ease: "back.out(1.6)" }, at);
      tl.to("#gg-face-bg", { attr: { fill: c }, duration: 0.3, ease: "none" }, at);
      tl.to("#gg-brow-l", { attr: { y1: 176 - v * 18, y2: 200 + v * 14 }, duration: 0.25, ease: "power2.out" }, at);
      tl.to("#gg-brow-r", { attr: { y1: 176 - v * 18, y2: 200 + v * 14 }, duration: 0.25, ease: "power2.out" }, at);
      tl.fromTo("#gg-face", { scale: 1.18, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, at);
    });
    tl.to("#gg-mouth", { attr: { d: "M 180 292 Q 220 252 260 292" }, duration: 0.3, ease: "power2.out" }, 8.74 - H);

    // Maxed out: the gauge trembles.
    for (let k = 0; k < 10; k++) {
      tl.to("#gg-wrap", { x: k % 2 ? -8 : 8, duration: 0.04, ease: "none" }, 10.3 - H + k * 0.04);
    }
    tl.to("#gg-wrap", { x: 0, duration: 0.04, ease: "none" }, 10.3 - H + 0.4);

    tl.to("#gg-wrap", { opacity: 0, scale: 0.6, duration: 0.22, ease: "back.in(2)" }, 11.12 - H);

    window.__timelines["gauge"] = tl;
  </script>
