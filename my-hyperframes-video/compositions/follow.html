  <script>
    const tl = gsap.timeline({ paused: true });
    const TAP = 1.85;
    const EXIT = 3.25;

    // Background and staggered pop-ins.
    tl.fromTo("#fo-bg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
    tl.fromTo("#fo-photo", { scale: 1.12 }, { scale: 1.2, duration: 3.8, ease: "none" }, 0);
    const pop = (sel, at, from) =>
      tl.fromTo(
        sel,
        Object.assign({ opacity: 0, scale: 0.82, y: 50 }, from || {}),
        { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.8)" },
        at,
      );
    pop("#fo-title", 0.1, { y: -70 });
    pop("#fo-sub", 0.22);
    tl.fromTo(
      "#fo-card",
      { opacity: 0, y: 300, rotationX: 28, scale: 0.88, transformPerspective: 2400, transformOrigin: "50% 100%" },
      { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: 0.6, ease: "back.out(1.4)" },
      0.32,
    );
    tl.fromTo("#fo-avatar", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 0.48);
    tl.to("#fo-ring", { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#fo-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.9);
    pop("#fo-name", 0.62);
    pop("#fo-stats", 0.7);
    pop("#fo-dc", 0.78);
    pop("#fo-btns", 0.86, { y: 70 });
    tl.fromTo("#fo-sweep", { x: 0, rotation: 18 }, { x: 2700, rotation: 18, duration: 0.7, ease: "power2.inOut" }, 1.0);

    // Finger slides in and taps Follow.
    tl.fromTo(
      "#fo-hand",
      { x: 1230, y: 1030, opacity: 0, rotation: -12 },
      { x: 0, y: 0, opacity: 1, rotation: -12, duration: 0.55, ease: "power3.out" },
      1.15,
    );
    tl.to("#fo-hand", { scale: 0.88, duration: 0.08, ease: "power2.in" }, TAP - 0.08);
    tl.to("#fo-hand", { scale: 1, duration: 0.12, ease: "power2.out" }, TAP);
    tl.to("#fo-hand", { x: 900, y: 700, opacity: 0, duration: 0.35, ease: "power3.in" }, 2.4);

    tl.to("#fo-follow", { scale: 0.94, duration: 0.08, ease: "power2.in" }, TAP - 0.08);
    tl.to("#fo-follow", { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.4)" }, TAP);
    tl.to("#fo-follow", { backgroundColor: "rgba(255,255,255,0.14)", boxShadow: "0 0 0 rgba(0,0,0,0)", duration: 0.15, ease: "none" }, TAP + 0.03);
    tl.fromTo("#fo-ripple", { scale: 0, opacity: 1 }, { scale: 1, opacity: 0, duration: 0.5, ease: "power2.out" }, TAP);
    tl.to("#fo-lbl-follow", { opacity: 0, y: -30, duration: 0.1, ease: "power2.in" }, TAP + 0.03);
    tl.fromTo("#fo-lbl-following", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, TAP + 0.08);
    tl.to("#fo-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, TAP + 0.1);

    // Burst of rays around the button.
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const deg = (a * 180) / Math.PI + 90;
      tl.set(`#fo-ray-${k}`, { backgroundColor: k % 2 ? "#ffd23f" : "#ffffff", rotation: deg }, 0);
      tl.fromTo(
        `#fo-ray-${k}`,
        { x: Math.cos(a) * 437, y: Math.sin(a) * 172, opacity: 1, scaleY: 1 },
        { x: Math.cos(a) * 741, y: Math.sin(a) * 292, opacity: 0, scaleY: 0.2, duration: 0.45, ease: "power3.out" },
        TAP + 0.02,
      );
    }

    // Follower count rolls 302 → 303.
    tl.fromTo("#fo-n1", { y: 0, opacity: 1 }, { y: -100, opacity: 0, duration: 0.3, ease: "back.in(1.4)" }, TAP + 0.12);
    tl.fromTo("#fo-n2", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, TAP + 0.15);

    // Bell rings.
    [22, -18, 14, -10, 6, 0].forEach((r, i) => {
      tl.to("#fo-bell", { rotation: r, transformOrigin: "50% 10%", duration: 0.07, ease: "sine.inOut" }, TAP + 0.1 + i * 0.07);
    });

    // Toast notification drops in, then leaves.
    tl.fromTo("#fo-toast", { y: -420, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 2.05);
    tl.fromTo("#fo-toast-icon", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.15);
    tl.to("#fo-toast-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, 2.2);

    // Exit: everything pops out in reverse order.
    ["#fo-btns", "#fo-dc", "#fo-stats", "#fo-name", "#fo-avatar", "#fo-card", "#fo-sub", "#fo-title"].forEach((sel, i) => {
      tl.to(sel, { opacity: 0, scale: 0.4, duration: 0.22, ease: "back.in(1.6)" }, EXIT + i * 0.045);
    });
    tl.to("#fo-black", { opacity: 1, duration: 0.25, ease: "power2.in" }, 3.55);

    window.__timelines["follow"] = tl;
  </script>
