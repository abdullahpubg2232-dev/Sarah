    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cam", { scale: 1.02 }, { scale: 1.08, duration: 66.08, ease: "none" }, 0);
      tl.to("#cam", { scale: 1.04, duration: 0.3, ease: "power2.out" }, 66.08);
      tl.set("#punch", { scale: 1 }, 0);
      [
        [12.3, 1.045],
        [15.95, 1.045],
        [22.9, 1.045],
        [31.75, 1.045],
        [34.33, 1.045]
      ].forEach(([t, s]) => {
        tl.to("#punch", { scale: s, duration: 0.2, ease: "back.out(2)" }, t);
        tl.to("#punch", { scale: 1, duration: 0.7, ease: "power2.inOut" }, t + 1.2);
      });
      tl.fromTo("#streak0", { x: 0, rotation: 18, opacity: 0 }, { x: 4200, rotation: 18, opacity: 1, duration: 0.55, ease: "power2.inOut" }, 15.45);
      tl.fromTo("#streak1", { x: 0, rotation: 18, opacity: 0 }, { x: 4200, rotation: 18, opacity: 1, duration: 0.55, ease: "power2.inOut" }, 22.45);
